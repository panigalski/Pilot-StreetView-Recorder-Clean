plugins {
    id 'com.android.application'
}

android {
    namespace 'com.panigalski.pilotstreetview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.panigalski.pilotstreetview'
        minSdk 24
        targetSdk 29
        versionCode 109
        versionName '1.8.1-stop-cue-resource-fix'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                    'lib/arm64-v8a/libc++.so',
                    'lib/arm64-v8a/libcutils.so'
            ]
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':pano')
    implementation 'androidx.annotation:annotation:1.8.2'
}
