plugins {
    id 'com.android.library'
}

android {
    namespace 'com.pi.pilot.pano.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 29
        consumerProguardFiles 'consumer-rules.pro'
        buildConfigField 'boolean', 'PI_DEBUG', 'true'
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PI_DEBUG', 'true'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'PI_DEBUG', 'false'
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += ['src/annotation/java', 'src/main_ext/java']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
}
